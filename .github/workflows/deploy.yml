name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.159.1"
          extended: true

      - name: Build site
        run: hugo --gc --minify --templateMetrics --templateMetricsHints --forceSyncStatic
        env:
          HUGO_ENVIRONMENT: production

      - name: Verify build
        run: |
          echo "Build complete"
          echo "Size:"
          du -sh public/
          echo "Pages built:"
          find public/ -name '*.html' | wc -l

      - name: Deploy
        run: |
          wget https://pkgs.tailscale.com/stable/tailscale_1.96.4_amd64.tgz -P /tmp
          sudo tar xzf /tmp/tailscale_1.96.4_amd64.tgz -C /usr/local/bin --strip-components=1
          rm /tmp/tailscale_1.96.4_amd64.tgz
          sudo mkdir -p /var/run/tailscale
          sudo apt-get install -y iptables
          sudo update-alternatives --set iptables /usr/sbin/iptables-legacy
          sudo tailscaled --state="mem:" &
          sudo tailscale up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=github-deploy --accept-routes
          tailscale status
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" public/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
